services:
  lanytic:
    build: https://github.com/forke24x7/LANytic.git#main
    pull_policy: build
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8840}
      DB_PATH: /data/lan.sqlite3
    volumes:
      - lanytic-data:/data
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 3m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  lanytic-data:
