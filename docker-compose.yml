services:
  lanytic:
    build: https://github.com/forke24x7/LANytic.git#main
    pull_policy: build
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8840}
      IFACES: ${IFACES:?Set IFACES in .env to your LAN interface}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-120}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-60}
      DB_PATH: /data/lan.sqlite3
      TZ: ${TZ:-Europe/Berlin}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set your own AUTH_PASSWORD in .env}
    volumes:
      - lanytic-data:/data
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 3m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  lanytic-data:
