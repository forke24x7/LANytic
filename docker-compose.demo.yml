# Standalone preview: no host network, no scan privileges, separate data.
services:
  lanytic-demo:
    build: .
    image: lanytic:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:8841:8840'
    environment:
      DEMO: 'true'
      DB_PATH: /data/demo.sqlite3
    volumes:
      - lanytic-demo-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
volumes:
  lanytic-demo-data:
