name: Test and Docker build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: docker build -t lanytic:test .
      - name: Container smoke test
        run: |
          docker run -d --name lanytic-smoke --cap-drop ALL --read-only --tmpfs /tmp --tmpfs /data -e DEMO=true -e DB_PATH=/data/demo.sqlite3 -p 127.0.0.1:8841:8840 lanytic:test
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8841/api/state') as r:
                      state = json.load(r)
                  assert state['config']['demo'] is True
                  assert len(state['devices']) == 10
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container failed to start')
          PY
          docker exec lanytic-smoke arp-scan --version
      - name: Compose configuration
        env:
          IFACES: eth0
          AUTH_PASSWORD: ci-only-test-password
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.demo.yml config --quiet
      - name: Container logs
        if: always()
        run: docker logs lanytic-smoke || true
